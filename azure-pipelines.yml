# Docs Filler — CI/CD for Azure DevOps.
#
# Pull requests to main:  run the tests only.
# Merge to main:          run the tests, then deploy the static site in `site/`
#                         to Azure Static Web Apps (free tier).
#
# The app is now a fully client-side static site — all document filling happens
# in the browser, so there is no server, no container, and nothing to store. The
# only Azure resource is a free Static Web App, provisioned once (out-of-band)
# via the portal or Azure CLI. Copy its deployment token into a **secret**
# pipeline variable named `deployment_token` (Pipelines → Edit → Variables, keep
# it secret) — that token is all this pipeline needs to publish.
#
# The retained Python (CLI, core, FastAPI app, tests) is still exercised by the
# Test stage below but is no longer deployed.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: pythonVersion
    value: 3.12
  # Deploy only on a real merge to main (not on PR validation builds).
  - name: isDeploy
    value: $[and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))]

stages:
  # ---------------------------------------------------------------------------
  - stage: Test
    displayName: Run tests
    jobs:
      - job: BanditChecks
        displayName: 'Bandit Security Scan'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
              addToPath: true

          - script: |
              pip install bandit
              bandit -r -ll -ii -x logs/,reports/,fonts/ -s B101 $(Build.SourcesDirectory)
            displayName: 'Run Bandit security checks'
      - job: pytest
        displayName: 'Run Unit Tests'
        dependsOn: BanditChecks
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
            displayName: Install dependencies
          - script: pytest -q --junitxml=$(Build.SourcesDirectory)/test-results.xml
            displayName: pytest
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results.xml

  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: Deploy to Azure Static Web Apps
    dependsOn: Test
    condition: and(succeeded(), eq(variables.isDeploy, 'True'))
    jobs:
      - job: deploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            submodules: true
          # Publish the prebuilt static site in `site/`. No build step — the
          # assets (index.html, app.js, vendored libs) are committed as-is.
          - task: AzureStaticWebApp@0
            displayName: Publish site/ to Static Web Apps
            inputs:
              app_location: 'site'
              output_location: ''
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: $(deployment_token)
